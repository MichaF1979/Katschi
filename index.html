<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10263a">
  <meta name="description" content="Der Countdown bis zum nächsten Skifahren am Katschberg.">
  <title>Countdown: Skifahren | Katschberg</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ice: #f5fbff;
      --panel: rgba(8, 24, 39, .58);
    }

    * { box-sizing: border-box; }

    html, body { min-width: 320px; min-height: 100%; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: start center;
      overflow-x: hidden;
      padding: max(9vh, env(safe-area-inset-top) + 32px) 20px max(32px, env(safe-area-inset-bottom));
      color: var(--ice);
      background: #19344a url("./assets/katschberg.png") center 48% / cover fixed no-repeat;
      isolation: isolate;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      content: "";
      background:
        linear-gradient(180deg, rgba(6, 24, 42, .12) 0%, rgba(6, 24, 42, .22) 35%, rgba(6, 20, 33, .58) 100%),
        linear-gradient(90deg, rgba(6, 24, 42, .22), transparent 70%);
    }

    main {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: min(240px, calc(100vw - 32px));
      margin: 0;
      text-align: center;
    }

    .card {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .34);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
    }

    .unit {
      min-width: 0;
      padding: 8px 2px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 8px;
      background: rgba(245, 251, 255, .12);
    }

    .number {
      display: block;
      font-size: clamp(1rem, 2vw, 1.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      line-height: 1.1;
    }

    .label {
      display: block;
      margin-top: 4px;
      color: rgba(245, 251, 255, .8);
      font-size: clamp(.48rem, .8vw, .6rem);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      body { padding-inline: 14px; background-position: 48% center; background-attachment: scroll; }
    }

    @media (max-width: 480px) and (orientation: portrait) {
      body {
        background-image: url("./assets/katschberg-iphone.jpg");
        background-position: left center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-label="Countdown">
      <div class="grid" role="timer" aria-label="Countdown bis zum Skifahren">
        <div class="unit"><span class="number" id="d">0</span><span class="label">Tage</span></div>
        <div class="unit"><span class="number" id="h">00</span><span class="label">Stunden</span></div>
        <div class="unit"><span class="number" id="m">00</span><span class="label">Minuten</span></div>
        <div class="unit"><span class="number" id="s">00</span><span class="label">Sekunden</span></div>
      </div>
    </section>
  </main>

  <script>
    const target = new Date("2026-12-28T10:00");

    function tick() {
      const seconds = Math.max(0, Math.floor((target.getTime() - Date.now()) / 1000));
      document.getElementById("d").textContent = String(Math.floor(seconds / 86400));
      document.getElementById("h").textContent = String(Math.floor(seconds / 3600) % 24).padStart(2, "0");
      document.getElementById("m").textContent = String(Math.floor(seconds / 60) % 60).padStart(2, "0");
      document.getElementById("s").textContent = String(seconds % 60).padStart(2, "0");
    }

    tick();
    window.setInterval(tick, 1000);
  </script>
</body>
</html>
